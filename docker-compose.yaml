services:
  db:
    container_name: 'skills_core_pg'
    image: postgres:16.4
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: "skills_core_redis"
    image: redis:7.4
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "6383:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - app_network
    restart: always
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

networks:
  app_network:
    external: true
